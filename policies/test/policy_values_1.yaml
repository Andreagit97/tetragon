apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "tmp-policy-values-1"
spec:
  podSelector:
    matchLabels:
      app: "my-deployment-1"
  kprobes:
  - call: "security_bprm_creds_for_exec"
    syscall: false
    args:
    - index: 0
      type: "linux_binprm"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Equal"
        values:
        - "/usr/bin/impossible_1"
        - "/usr/bin/impossible_2"
  options:
  - name: refPolicy
    value: "default/simple-for-each-policy"
