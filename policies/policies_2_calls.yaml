apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "policy-multiple-calls"
spec:
  kprobes:
  - call: "security_bprm_creds_for_exec"
    syscall: false
    args:
    - index: 0
      type: "linux_binprm"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Equal"
        values:
        - "/usr/bin/impossible"
  - call: "security_mmap_file"
    syscall: false
    args:
    - index: 0
      type: "file" # (struct file *) used for getting the path
    selectors:
    - matchArgs:      
      - index: 0
        operator: "Equal"
        values:
        - "/sys/impossible/path" 
  options:
  - name: disable-kprobe-multi
    value: "1"
