apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "policy-example-2"
spec:
  podSelector:
    matchLabels:
      app: "client"
  kprobes:
  - call: "security_bprm_creds_for_exec"
    syscall: false
    args:
    - index: 0
      type: "linux_binprm"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Equal"
        values:
        - "/usr/bin/impossible"
      matchActions:
      - action: Override
        argError: -1
  options:
  - name: disable-kprobe-multi
    value: "1"
